<div class="patient-banner">
  <div class="patient-banner__avatar">
    {{ (patient.first_name || '?').charAt(0) }}{{ (patient.last_name || '?').charAt(0) }}
  </div>
  <div class="patient-banner__info">
    <h2 class="patient-banner__name">{{ patient.first_name }} {{ patient.last_name }}</h2>
    <div class="patient-banner__meta">
      <span *ngIf="patient.birth_date">Né(e) le {{ patient.birth_date }}</span>
      <span *ngIf="patient.gender">· {{ patient.gender }}</span>
      <span *ngIf="patient.medical_record_number">· Dossier n° {{ patient.medical_record_number }}</span>
    </div>
  </div>
</div>
